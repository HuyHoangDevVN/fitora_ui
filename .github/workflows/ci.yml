name: Frontend CI

on:
  pull_request:
    branches: [develop, staging]
  push:
    branches: [develop, staging]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.18.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: /api
      - run: |
          test -f dist/index.html
          test -d dist/assets
          ! rg -n 'fitora-api\.aiotlab\.edu\.vn|fitora\.aiotlab\.edu\.vn' dist
